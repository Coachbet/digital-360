[project]
name = "digital360-backend"
version = "0.2.0"
description = "Digital 360 — plateforme de reporting pour agences (FastAPI, DDD)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "boto3>=1.34",
    "reportlab>=4.2",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
